bota_to_camera:
  filled: false
  status: untrusted_experimental_candidate
  direction: camera_frame_to_current_pose_subject_frame
  units: metres
  source: Mark Vlutters CAD derivation plus convention comparison, 2026-08-24
  validation:
    diagnostic_contact_hits: 6
    diagnostic_contact_events: 7
    independent_validation: false
    note: >
      The candidate is retained only to reproduce prior diagnostics. Its
      rotation/translation-frame construction is unresolved and convention
