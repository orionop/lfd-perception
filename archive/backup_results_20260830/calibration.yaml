  #     intrinsic  Rz(-135)@Rx(45)   axis [-0.5,  0.5,  0.7071]   66.9 deg off
  #     extrinsic  Rx(45) @Rz(-135)  axis [ 0.0, -0.7071, 0.7071] 17.2 deg off
